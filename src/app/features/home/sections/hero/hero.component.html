<section id="hero" class="hero" aria-label="Intro">
  <div class="hero__ambient" aria-hidden="true"></div>
  <div class="hero__grid-lines" aria-hidden="true"></div>

  <div class="hero__container">
    <p class="hero__greeting hero__anim hero__anim--1">
      {{ 'HERO_GREETING' | translate }}
    </p>

    <h1 class="hero__title">
      <span class="hero__title-mask">
        <span class="hero__title-inner hero__anim-slide hero__anim-slide--1">Dennis Schwarz</span>
      </span>
      <span class="hero__title-mask">
        <span
          class="hero__title-inner hero__title-inner--accent hero__anim-slide hero__anim-slide--2"
        >
          {{ 'TITLE' | translate }}
        </span>
      </span>
    </h1>

    <p class="hero__location hero__anim hero__anim--2">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 48 48">
        <path d="M0 0h48v48H0z" fill="none" />
        <g
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="3.4"
        >
          <path
            d="M24 6c8 0 14 6.2 14 14c0 8-9.5 15.6-14 22c-4.5-6.4-14-14-14-22c0-7.8 6-14 14-14"
          />
          <path d="M24 14.6c3.1-.1 5.1 1.9 5 5c-.1 3-2.1 4.9-5 4.8s-4.8-2-4.8-4.9s2-4.8 4.8-4.9" />
        </g>
      </svg>

      {{ 'HERO_LOCATION' | translate }}
    </p>

    <div class="hero__divider hero__anim-line" aria-hidden="true"></div>

    <p class="hero__lead hero__anim hero__anim--3">
      {{ 'HERO_SUBLINE' | translate }}
    </p>

    <div class="hero__actions hero__anim hero__anim--4">
      <button type="button" class="btn btn--bronze" (click)="scrollTo('projects')">
        <span>{{ 'CHECK_MY_WORK' | translate }}</span>
        <svg
          class="btn__icon"
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <path d="M7 17L17 7M17 7H8M17 7V16" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>

      <button type="button" class="btn btn--ghost" (click)="scrollTo('contact')">
        <span>{{ 'CONTACT_ME' | translate }}</span>
      </button>
    </div>
  </div>

  <footer class="hero__footer hero__anim hero__anim--5">
    <button
      type="button"
      class="hero__scroll-cue"
      (click)="scrollTo('about')"
      [attr.aria-label]="'ABOUT_ME' | translate"
    >
      <span class="hero__scroll-track">
        <span class="hero__scroll-runner"></span>
      </span>
      <span>{{ 'SCROLL_LABEL' | translate }}</span>
    </button>

    <div class="hero__socials">
      <a href="mailto:kontakt@dennis-schwarz.dev" class="hero__mail-link">
        kontakt&#64;dennis-schwarz.dev
      </a>
      <span class="hero__separator" aria-hidden="true"></span>
      <a
        href="https://github.com/DennisSchwarz1995"
        target="_blank"
        rel="noopener noreferrer"
        class="hero__social-icon"
        aria-label="GitHub"
        appTooltip="GitHub"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path
            d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </a>
      <a
        href="https://www.linkedin.com/in/dennis-schwarz-47ba5b338/"
        target="_blank"
        rel="noopener noreferrer"
        class="hero__social-icon"
        aria-label="LinkedIn"
        appTooltip="LinkedIn"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path
            d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2z"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="4" cy="4" r="2" />
        </svg>
      </a>
    </div>
  </footer>
</section>
