<header
  class="header"
  [class.header--scrolled]="isScrolled()"
  [class.header--menu-open]="isMobileMenuOpen()"
>
  <div class="header__inner">
    <button type="button" class="brand" (click)="goHome()" aria-label="Dennis Schwarz – Home">
      <span class="brand__monogram" aria-hidden="true">DS</span>
      <span class="brand__text">
        <span class="brand__name">Dennis Schwarz</span>
        <span class="brand__role">{{ 'TITLE' | translate }}</span>
      </span>
    </button>

    <nav class="nav-desktop" aria-label="Primary Navigation">
      @for (item of navItems; track item.id) {
        <button
          type="button"
          class="nav-desktop__link"
          [class.nav-desktop__link--active]="activeSection() === item.id"
          [attr.aria-current]="activeSection() === item.id ? 'location' : null"
          (click)="navigate(item.id)"
        >
          {{ item.labelKey | translate }}
        </button>
      }
    </nav>

    <div class="header__controls">
      <div class="lang-switch" role="group" aria-label="Language Switcher">
        <span
          class="lang-switch__thumb"
          [class.lang-switch__thumb--en]="i18n.lang() === 'en'"
          aria-hidden="true"
        ></span>
        <button
          type="button"
          class="lang-switch__btn"
          [class.lang-switch__btn--active]="i18n.lang() === 'de'"
          [attr.aria-pressed]="i18n.lang() === 'de'"
          (click)="onLanguageClick('de')"
        >
          DE
        </button>
        <button
          type="button"
          class="lang-switch__btn"
          [class.lang-switch__btn--active]="i18n.lang() === 'en'"
          [attr.aria-pressed]="i18n.lang() === 'en'"
          (click)="onLanguageClick('en')"
        >
          EN
        </button>
      </div>

      <button type="button" class="header__cta" (click)="onLetsTalkClick()">
        {{ 'LETS_TALK' | translate }}
      </button>

      <button
        type="button"
        class="burger"
        [class.burger--open]="isMobileMenuOpen()"
        [attr.aria-expanded]="isMobileMenuOpen()"
        aria-label="Toggle Menu"
        (click)="toggleMobileMenu()"
      >
        <span class="burger__line"></span>
        <span class="burger__line"></span>
      </button>
    </div>
  </div>

  @if (isMobileMenuOpen()) {
    <div class="mobile-drawer">
      <nav class="mobile-drawer__nav" aria-label="Mobile Navigation">
        @for (item of navItems; track item.id; let idx = $index) {
          <button
            type="button"
            class="mobile-drawer__link"
            [class.mobile-drawer__link--active]="activeSection() === item.id"
            (click)="navigate(item.id)"
          >
            <span class="mobile-drawer__index">0{{ idx + 1 }}</span>
            <span>{{ item.labelKey | translate }}</span>
          </button>
        }
      </nav>

      <div class="mobile-drawer__footer">
        <a href="mailto:kontakt@dennis-schwarz.dev" class="mobile-drawer__mail">
          kontakt&#64;dennis-schwarz.dev
        </a>
        <div class="mobile-drawer__socials">
          <a href="https://github.com/DennisSchwarz1995" target="_blank" rel="noopener noreferrer"
            >GitHub</a
          >
          <a
            href="https://www.linkedin.com/in/dennis-schwarz-47ba5b338/"
            target="_blank"
            rel="noopener noreferrer"
            >LinkedIn</a
          >
        </div>
      </div>
    </div>
  }
</header>
